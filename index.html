<div id="menu"><div style="font-size:34px">💞</div><h1>Esra'nın Dilek Oyunu</h1><p class="sub">Cumali bugün senin cinin. Bir dilek seç, hemen yerine getirsin. Mutlu yıllar aşkım.</p><div class="days" id="dy"></div><div id="g"></div></div>

<path d="M414,311Q406,336 424,350Q440,358 456,350Q474,336 466,311" stroke="#1c1517" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M413,311Q427,300 440,306Q453,300 467,311Q453,309 440,312Q427,309 413,311Z" fill="#1c1517" stroke="#1c1517" stroke-width="3"/><path d="M424,346Q440,370 456,346Q440,353 424,346Z" fill="#1c1517" stroke="#1c1517" stroke-width="3"/>
${o.arms??ARMS}

{n:'Çalışırken sürpriz yap',e:'🌹',m:4,L:16,c:[[0,'Esra bilgisayar başında çalışıyor...'],[2,'Cumali sessizce arkasına geldi. Sürpriz!'],[5.5,'Gül yaprakları yağıyor, Esra gülümsüyor ♥']],v:()=>[[0,svg(WALL()+cum({})+esra({ra:HA})+DESK+petals()+hearts(5.6))]]},

function music(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const d=AC.createDelay(),f=AC.createGain();d.delayTime.value=.38;f.gain.value=.35;d.connect(f);f.connect(d);f.connect(AC.destination);AC.dl=d}AC.resume&&AC.resume()}
function note(f,t0,v,w){const o=AC.createOscillator(),g=AC.createGain();o.type=w||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.02);g.gain.exponentialRampToValueAtTime(.0005,t0+1.6);o.connect(g);g.connect(AC.destination);g.connect(AC.dl);o.start(t0);o.stop(t0+1.7)}
function tick(){if(!AC||!mu||!MS||AC.currentTime<nx)return;if(nx<AC.currentTime-1)nx=AC.currentTime;const[w,st,v,cs,pt]=MS,c=cs[Math.floor(beat/pt.length)%cs.length],k=pt[beat%pt.length];if(k>=0)note(F(c[k%3]+(k>2?12:0)),nx,v,w);if(beat%pt.length==0)note(F(c[0]-12),nx,v*1.2,w=='sawtooth'?'triangle':w);beat++;nx+=st}

let tm=[],ci=0;
function play(i){tm.forEach(clearTimeout);tm=[];ci=i;const s=SC[i];$('#menu').style.display='none';$('#st').style.display='block';$('#tt').textContent=s.e+' '+s.n;
 s.v().forEach(([t,x])=>tm.push(setTimeout(()=>$('#s').innerHTML=x,t*1e3)));s.c.forEach(([t,x])=>tm.push(setTimeout(()=>$('#cap').textContent=x,t*1e3)));tm.push(setTimeout(()=>play(i),s.L*1e3));MS=MU[s.m];beat=0;nx=0;music()}

$('#g').onclick=e=>{const b=e.target.closest('button');if(b)play(+b.dataset.i)};
